<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2925 1532" role="img" aria-labelledby="pt pd"><title id="pt">Who the law impacts</title><desc id="pd">Who the law impacts. Five eligibility categories. The left panel shows what impacted each one per $100 of Medicaid spending, with the FY2030 remainder solid inside the FY2024 outline. The right panel shows the fall for each, at 5 times the scale, split into coverage and rate. New adult group: $19.59 in FY2024 and $14.16 in FY2030, of which $4.79 of the fall is coverage and $0.64 is rate. Disabled: $25.17 in FY2024 and $23.97 in FY2030, of which $0.29 of the fall is coverage and $0.90 is rate. Aged: $18.55 in FY2024 and $17.64 in FY2030, of which $0.21 of the fall is coverage and $0.69 is rate. Children: $13.58 in FY2024 and $12.97 in FY2030, of which $0.16 of the fall is coverage and $0.46 is rate. Other adult: $10.19 in FY2024 and $9.73 in FY2030, of which $0.12 of the fall is coverage and $0.34 is rate. Composition by service is in Figure 4; the loss is not divided by service anywhere in this paper.</desc><rect width="2925" height="1532" fill="#ffffff"/><text x="47.0" y="82.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="29" fill="#17325c" text-anchor="start" font-weight="bold" letter-spacing="2.4">AGILIAN</text><text x="47.0" y="129.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="29" fill="#6f6a64" text-anchor="start" font-weight="normal" letter-spacing="1.5">THE MEDICAID DOLLAR PROJECT</text><text x="47.0" y="222.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="70" fill="#1b1b1b" text-anchor="start" font-weight="bold">Who the law impacts</text><text x="47.0" y="275.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="35" fill="#6f6a64" text-anchor="start" font-weight="normal">Dollars off the hundred, by eligibility category</text><line x1="47" y1="298" x2="2878" y2="298" stroke="#ded7c8" stroke-width="5.0"/><text x="585.0" y="264.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" fill="#1b1b1b" text-anchor="start" font-weight="bold" letter-spacing="1.1">WHAT IMPACTED THEM, PER $100</text><text x="1802.0" y="264.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" fill="#6f4747" text-anchor="start" font-weight="bold" letter-spacing="1.1">THE FALL, AT 5× THE SCALE</text><rect x="2340.0" y="229.0" width="47" height="40" fill="#8B5A5A" stroke="#5c3a3a" stroke-width="4.0"/><text x="2403.0" y="262.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="31" fill="#1b1b1b" text-anchor="start" font-weight="normal">coverage</text><rect x="2621.0" y="229.0" width="47" height="40" fill="#c4a0a0" stroke="#6f4747" stroke-width="4.0"/><text x="2684.0" y="262.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="31" fill="#1b1b1b" text-anchor="start" font-weight="normal">rate</text><line x1="1744" y1="222" x2="1744" y2="1169" stroke="#ded7c8" stroke-width="5.0"/><text x="550.0" y="379.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="45" fill="#1b1b1b" text-anchor="end" font-weight="bold">New adult group</text><text x="550.0" y="423.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" fill="#6f6a64" text-anchor="end" font-weight="normal" font-style="italic">§71119 and §71107 impact this</text><text x="550.0" y="458.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" fill="#6f6a64" text-anchor="end" font-weight="normal" font-style="italic">group and no other</text><rect x="585.0" y="335.0" width="710.8" height="70" fill="none" stroke="#7d8fa3" stroke-width="5.0"/><rect x="585.0" y="335.0" width="513.8" height="70" fill="#17325c"/><text x="608.0" y="384.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="43" fill="#ffffff" text-anchor="start" font-weight="bold">$14.16</text><text x="1744.0" y="384.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="33" fill="#6f6a64" text-anchor="end" font-weight="normal">of $19.59</text><path d="M1098.8,417.0 L1767.0,417.0 L1802.0,335.0" fill="none" stroke="#7d8fa3" stroke-width="4.0" stroke-dasharray="12,12"/><rect x="1802.0" y="335.0" width="869.0" height="70" fill="#8B5A5A" stroke="#5c3a3a" stroke-width="5.0"/><rect x="2671.0" y="335.0" width="115.9" height="70" fill="#c4a0a0" stroke="#6f4747" stroke-width="5.0"/><path d="M2236.5,335.0 L2236.5,321.0 L2250.5,321.0" fill="none" stroke="#6f4747" stroke-width="4.0"/><text x="2259.5" y="309.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="33" fill="#6f4747" text-anchor="start" font-weight="bold">−$4.79  coverage</text><path d="M2729.0,405.0 L2729.0,424.0 L2663.1,424.0" fill="none" stroke="#6f4747" stroke-width="4.0"/><text x="2672.1" y="454.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="33" fill="#6f4747" text-anchor="start" font-weight="normal">−$0.64  rate</text><text x="550.0" y="559.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="45" fill="#1b1b1b" text-anchor="end" font-weight="bold">Disabled</text><text x="550.0" y="603.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" fill="#6f6a64" text-anchor="end" font-weight="normal" font-style="italic">rates, not enrolment: the directed</text><text x="550.0" y="638.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" fill="#6f6a64" text-anchor="end" font-weight="normal" font-style="italic">payment cap and the contraction</text><rect x="585.0" y="515.0" width="913.0" height="70" fill="none" stroke="#7d8fa3" stroke-width="5.0"/><rect x="585.0" y="515.0" width="869.8" height="70" fill="#17325c"/><text x="608.0" y="564.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="43" fill="#ffffff" text-anchor="start" font-weight="bold">$23.97</text><text x="1744.0" y="564.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="33" fill="#6f6a64" text-anchor="end" font-weight="normal">of $25.17</text><path d="M1454.8,597.0 L1767.0,597.0 L1802.0,515.0" fill="none" stroke="#7d8fa3" stroke-width="4.0" stroke-dasharray="12,12"/><rect x="1802.0" y="515.0" width="52.6" height="70" fill="#8B5A5A" stroke="#5c3a3a" stroke-width="5.0"/><rect x="1854.6" y="515.0" width="163.7" height="70" fill="#c4a0a0" stroke="#6f4747" stroke-width="5.0"/><path d="M1828.3,515.0 L1828.3,501.0 L1842.3,501.0" fill="none" stroke="#6f4747" stroke-width="4.0"/><text x="1851.3" y="489.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="33" fill="#6f4747" text-anchor="start" font-weight="bold">−$0.29  coverage</text><path d="M1936.4,585.0 L1936.4,604.0 L1950.4,604.0" fill="none" stroke="#6f4747" stroke-width="4.0"/><text x="1959.4" y="634.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="33" fill="#6f4747" text-anchor="start" font-weight="normal">−$0.90  rate</text><text x="550.0" y="739.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="45" fill="#1b1b1b" text-anchor="end" font-weight="bold">Aged</text><text x="550.0" y="783.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" fill="#6f6a64" text-anchor="end" font-weight="normal" font-style="italic">and a $1.27 bill: the Medicare</text><text x="550.0" y="818.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" fill="#6f6a64" text-anchor="end" font-weight="normal" font-style="italic">Savings rule suspended</text><rect x="585.0" y="695.0" width="672.9" height="70" fill="none" stroke="#7d8fa3" stroke-width="5.0"/><rect x="585.0" y="695.0" width="640.0" height="70" fill="#17325c"/><text x="608.0" y="744.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="43" fill="#ffffff" text-anchor="start" font-weight="bold">$17.64</text><text x="1744.0" y="744.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="33" fill="#6f6a64" text-anchor="end" font-weight="normal">of $18.55</text><path d="M1225.0,777.0 L1767.0,777.0 L1802.0,695.0" fill="none" stroke="#7d8fa3" stroke-width="4.0" stroke-dasharray="12,12"/><rect x="1802.0" y="695.0" width="38.7" height="70" fill="#8B5A5A" stroke="#5c3a3a" stroke-width="5.0"/><rect x="1840.7" y="695.0" width="125.6" height="70" fill="#c4a0a0" stroke="#6f4747" stroke-width="5.0"/><path d="M1821.4,695.0 L1821.4,681.0 L1835.4,681.0" fill="none" stroke="#6f4747" stroke-width="4.0"/><text x="1844.4" y="669.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="33" fill="#6f4747" text-anchor="start" font-weight="bold">−$0.21  coverage</text><path d="M1903.5,765.0 L1903.5,784.0 L1917.5,784.0" fill="none" stroke="#6f4747" stroke-width="4.0"/><text x="1926.5" y="814.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="33" fill="#6f4747" text-anchor="start" font-weight="normal">−$0.69  rate</text><text x="550.0" y="919.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="45" fill="#1b1b1b" text-anchor="end" font-weight="bold">Children</text><text x="550.0" y="963.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" fill="#6f6a64" text-anchor="end" font-weight="normal" font-style="italic">nothing in the law names children</text><rect x="585.0" y="875.0" width="492.7" height="70" fill="none" stroke="#7d8fa3" stroke-width="5.0"/><rect x="585.0" y="875.0" width="470.4" height="70" fill="#17325c"/><text x="608.0" y="924.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="43" fill="#ffffff" text-anchor="start" font-weight="bold">$12.97</text><text x="1744.0" y="924.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="33" fill="#6f6a64" text-anchor="end" font-weight="normal">of $13.58</text><path d="M1055.4,957.0 L1767.0,957.0 L1802.0,875.0" fill="none" stroke="#7d8fa3" stroke-width="4.0" stroke-dasharray="12,12"/><rect x="1802.0" y="875.0" width="28.4" height="70" fill="#8B5A5A" stroke="#5c3a3a" stroke-width="5.0"/><rect x="1830.4" y="875.0" width="83.0" height="70" fill="#c4a0a0" stroke="#6f4747" stroke-width="5.0"/><path d="M1816.2,875.0 L1816.2,861.0 L1830.2,861.0" fill="none" stroke="#6f4747" stroke-width="4.0"/><text x="1839.2" y="849.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="33" fill="#6f4747" text-anchor="start" font-weight="bold">−$0.16  coverage</text><path d="M1871.9,945.0 L1871.9,964.0 L1885.9,964.0" fill="none" stroke="#6f4747" stroke-width="4.0"/><text x="1894.9" y="994.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="33" fill="#6f4747" text-anchor="start" font-weight="normal">−$0.46  rate</text><text x="550.0" y="1099.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="45" fill="#1b1b1b" text-anchor="end" font-weight="bold">Other adult</text><text x="550.0" y="1143.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" fill="#6f6a64" text-anchor="end" font-weight="normal" font-style="italic">parents, caretakers, pregnancy —</text><text x="550.0" y="1178.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" fill="#6f6a64" text-anchor="end" font-weight="normal" font-style="italic">the work rule passes over them</text><rect x="585.0" y="1055.0" width="369.6" height="70" fill="none" stroke="#7d8fa3" stroke-width="5.0"/><rect x="585.0" y="1055.0" width="353.0" height="70" fill="#17325c"/><text x="608.0" y="1104.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="43" fill="#ffffff" text-anchor="start" font-weight="bold">$9.73</text><text x="1744.0" y="1104.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="33" fill="#6f6a64" text-anchor="end" font-weight="normal">of $10.19</text><path d="M938.0,1137.0 L1767.0,1137.0 L1802.0,1055.0" fill="none" stroke="#7d8fa3" stroke-width="4.0" stroke-dasharray="12,12"/><rect x="1802.0" y="1055.0" width="21.3" height="70" fill="#8B5A5A" stroke="#5c3a3a" stroke-width="5.0"/><rect x="1823.3" y="1055.0" width="61.9" height="70" fill="#c4a0a0" stroke="#6f4747" stroke-width="5.0"/><path d="M1812.7,1055.0 L1812.7,1041.0 L1826.7,1041.0" fill="none" stroke="#6f4747" stroke-width="4.0"/><text x="1835.7" y="1029.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="33" fill="#6f4747" text-anchor="start" font-weight="bold">−$0.12  coverage</text><path d="M1854.3,1125.0 L1854.3,1144.0 L1868.3,1144.0" fill="none" stroke="#6f4747" stroke-width="4.0"/><text x="1877.3" y="1174.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="33" fill="#6f4747" text-anchor="start" font-weight="normal">−$0.34  rate</text><text x="47.0" y="1298.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="31" fill="#1b1b1b" text-anchor="start" font-weight="normal">Coverage is somebody dropped: they are no longer enrolled and the whole of their care goes to zero.</text><text x="47.0" y="1347.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="31" fill="#1b1b1b" text-anchor="start" font-weight="normal">Rate is the same person, still enrolled, with their provider paid less. No individual loses a share of their own care.</text><text x="1802.0" y="1298.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="31" fill="#6f4747" text-anchor="start" font-weight="bold">The right-hand panel is drawn at 5 times the scale of the left.</text><line x1="47" y1="1403.0" x2="2878" y2="1403.0" stroke="#ded7c8" stroke-width="5.0"/><text x="47.0" y="1461.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="31" fill="#1b1b1b" text-anchor="start" font-weight="normal">$5.57 of the fall is coverage and $3.03 is rate.</text></svg>