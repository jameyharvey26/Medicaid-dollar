<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1500"><rect width="1000" height="1500" fill="#faf8f3"/><text x="80.0" y="104.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#17325c" text-anchor="start" font-weight="bold" letter-spacing="3.4">AGILIAN</text><text x="80.0" y="128.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#7a7570" text-anchor="start" font-weight="normal" letter-spacing="2.2">THE MEDICAID DOLLAR PROJECT</text><text x="80.0" y="196.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" fill="#1b1b1b" text-anchor="start" font-weight="bold">Seven cuts, one hundred dollars</text><text x="80.0" y="228.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#7a7570" text-anchor="start" font-weight="normal">Read down: where P.L. 119-21 takes it, and who carries it</text><line x1="80" y1="254" x2="920" y2="254" stroke="#e2dccf" stroke-width="1.3"/><text x="300.0" y="308.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="32" fill="#1b1b1b" text-anchor="start" font-weight="bold">$100</text><text x="404.0" y="308.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#7a7570" text-anchor="start" font-weight="normal">enters the state agency</text><line x1="80" y1="336.0" x2="920" y2="336.0" stroke="#e2dccf" stroke-width="1.2"/><text x="276.0" y="352.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#7a7570" text-anchor="end" font-weight="bold" letter-spacing="1.4">STATE AGENCY</text><rect x="300" y="346.0" width="168" height="77.5" fill="#8B5A5A" fill-opacity="0.88"/><text x="494.0" y="385.7" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#6f4747" text-anchor="start" font-weight="bold">−$1.25</text><text x="600.0" y="379.7" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#1b1b1b" text-anchor="start" font-weight="normal">Provider tax limits</text><text x="600.0" y="397.7" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#7a7570" text-anchor="start" font-weight="normal" font-style="italic">State budgets</text><rect x="300" y="427.5" width="168" height="65.6" fill="#8B5A5A" fill-opacity="0.88"/><text x="494.0" y="461.3" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#6f4747" text-anchor="start" font-weight="bold">−$1.06</text><text x="600.0" y="455.3" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#1b1b1b" text-anchor="start" font-weight="normal">Everything else</text><text x="600.0" y="473.3" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#7a7570" text-anchor="start" font-weight="normal" font-style="italic">Enrollees</text><line x1="80" y1="503.1" x2="920" y2="503.1" stroke="#e2dccf" stroke-width="1.2"/><text x="276.0" y="519.1" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#7a7570" text-anchor="end" font-weight="bold" letter-spacing="1.4">DISBURSEMENTS</text><rect x="300" y="513.1" width="168" height="254.6" fill="#8B5A5A" fill-opacity="0.88"/><text x="494.0" y="641.4" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#6f4747" text-anchor="start" font-weight="bold">−$4.11</text><text x="600.0" y="635.4" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#1b1b1b" text-anchor="start" font-weight="normal">Work reporting</text><text x="600.0" y="653.4" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#7a7570" text-anchor="start" font-weight="normal" font-style="italic">People who will not enroll</text><rect x="300" y="771.7" width="168" height="46.6" fill="#8B5A5A" fill-opacity="0.88"/><text x="494.0" y="797.7" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#6f4747" text-anchor="start" font-weight="bold">−$0.75</text><text x="600.0" y="791.7" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#1b1b1b" text-anchor="start" font-weight="normal">Six-month renewals</text><text x="600.0" y="809.7" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#7a7570" text-anchor="start" font-weight="normal" font-style="italic">People who will not renew</text><line x1="80" y1="831.7" x2="920" y2="831.7" stroke="#e2dccf" stroke-width="1.2"/><text x="276.0" y="847.7" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#7a7570" text-anchor="end" font-weight="bold" letter-spacing="1.4">CLAIMS TO PROVIDERS</text><rect x="300" y="841.7" width="168" height="64.5" fill="#8B5A5A" fill-opacity="0.88"/><text x="494.0" y="874.9" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#6f4747" text-anchor="start" font-weight="bold">−$1.04</text><text x="600.0" y="868.9" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#1b1b1b" text-anchor="start" font-weight="normal">Medicaid enrollment rule suspended</text><text x="600.0" y="886.9" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#7a7570" text-anchor="start" font-weight="normal" font-style="italic">People who would have had a paid claim</text><rect x="300" y="910.2" width="168" height="52.8" fill="#8B5A5A" fill-opacity="0.88"/><text x="494.0" y="937.6" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#6f4747" text-anchor="start" font-weight="bold">−$0.85</text><text x="600.0" y="931.6" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#1b1b1b" text-anchor="start" font-weight="normal">Directed payment caps</text><text x="600.0" y="949.6" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#7a7570" text-anchor="start" font-weight="normal" font-style="italic">Hospitals, nursing facilities, academic centres</text><line x1="80" y1="973.0" x2="920" y2="973.0" stroke="#e2dccf" stroke-width="1.2"/><text x="276.0" y="989.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#7a7570" text-anchor="end" font-weight="bold" letter-spacing="1.4">BENEFICIARIES</text><rect x="300" y="983.0" width="168" height="79.4" fill="#8B5A5A" fill-opacity="0.88"/><text x="494.0" y="1023.7" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#6f4747" text-anchor="start" font-weight="bold">−$1.28</text><text x="600.0" y="1017.7" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#1b1b1b" text-anchor="start" font-weight="normal">Medicare Savings rule suspended</text><text x="600.0" y="1035.7" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#7a7570" text-anchor="start" font-weight="normal" font-style="italic">Dual eligibles</text><rect x="300" y="1082.3" width="168" height="107.9" fill="#c9d3de" fill-opacity="0.9"/><text x="494.0" y="1137.3" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#7a7570" text-anchor="start" font-weight="bold">+$1.74</text><text x="600.0" y="1131.3" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#1b1b1b" text-anchor="start" font-weight="normal">Overhead falls with it</text><text x="600.0" y="1149.3" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#7a7570" text-anchor="start" font-weight="normal" font-style="italic">less money to administer</text><line x1="80" y1="1201.2" x2="920" y2="1201.2" stroke="#1b1b1b" stroke-width="1.8"/><rect x="300" y="1212.2" width="168" height="78" fill="#17325c"/><text x="494.0" y="1260.2" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="36" fill="#17325c" text-anchor="start" font-weight="bold">$8.60</text><text x="600.0" y="1246.2" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#1b1b1b" text-anchor="start" font-weight="bold">less reaches care</text><text x="600.0" y="1268.2" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#7a7570" text-anchor="start" font-weight="normal">in FY2030, out of every hundred dollars</text><line x1="80" y1="1404" x2="920" y2="1404" stroke="#e2dccf" stroke-width="1.3"/><text x="80.0" y="1432.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="start" font-weight="normal">P.L. 119-21 removes $10.34 of every $100. Overhead falls with it, returning $1.74.</text><text x="80.0" y="1454.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" fill="#7a7570" text-anchor="start" font-weight="normal">$8.60 less reaches care. FY2024 actual against FY2030 projected; every figure modelled from CBO and CMS-64.</text></svg>