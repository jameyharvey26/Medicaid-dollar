<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2925 1198" role="img" aria-labelledby="t_fig6_taper_all d_fig6_taper_all"><title id="t_fig6_taper_all">Where the money stops</title><desc id="d_fig6_taper_all">Where the money stops. A horizontal band of $100 of Medicaid spending, narrowing left to right as it passes 5 phases. At federal and state shares, $100.76 remains in FY2030 against $100.76 in FY2024. At state agency, $98.75 remains in FY2030 against $100.00 in FY2024. At disbursements, $84.47 remains in FY2030 against $92.73 in FY2024. At claims to providers, $79.32 remains in FY2030 against $87.07 in FY2024. At beneficiaries, $78.33 remains in FY2030 against $86.92 in FY2024. Marked below the band: Provider tax limits, $1.25, at federal and state shares, carried by state budgets; Everything else, $1.06, at state agency, carried by enrollees; Work reporting, $4.11, at disbursements, carried by people who will not enroll; Six-month renewals, $0.75, at disbursements, carried by people who will not renew; Medicaid enrollment rule suspended, $1.04, at claims to providers, carried by people who would have had a paid claim; Directed payment caps, $0.85, at claims to providers, carried by hospitals, nursing facilities, academic centres; Medicare Savings rule suspended, $1.28, at beneficiaries, carried by dual eligibles.</desc><rect width="2925" height="1198" fill="#ffffff"/><path d="M53.0,187.0 L53.0,446.0 L757.8,444.0 L1462.5,425.3 L2167.2,410.8 L2872.0,410.4 L2872.0,187.0 Z" fill="#ccd6e1" fill-opacity="0.75"/><path d="M53.0,446.0 L757.8,444.0 L1462.5,425.3 L2167.2,410.8 L2872.0,410.4" fill="none" stroke="#7d8fa3" stroke-width="5.0"/><path d="M53.0,187.0 L53.0,446.0 L757.8,440.8 L1462.5,404.1 L2167.2,390.8 L2872.0,388.3 L2872.0,187.0 Z" fill="#17325c"/><text x="82.0" y="262.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="54" fill="#ffffff" text-anchor="start" font-weight="bold">$100</text><text x="82.0" y="304.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="25" fill="#d9e2ee" text-anchor="start" font-weight="normal">of Medicaid spending</text><line x1="53.0" y1="187.0" x2="53.0" y2="446.0" stroke="#ffffff" stroke-width="5.0" stroke-opacity="0.85"/><text x="53.0" y="42.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" fill="#1b1b1b" text-anchor="start" font-weight="bold" letter-spacing="0.8">FEDERAL AND STATE SHARES</text><text x="53.0" y="93.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="23" fill="#6f6a64" text-anchor="start" font-weight="normal">was $100.76 in FY2024</text><text x="53.0" y="168.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="45" fill="#17325c" text-anchor="start" font-weight="bold">$100.76</text><line x1="757.8" y1="187.0" x2="757.8" y2="444.0" stroke="#ffffff" stroke-width="5.0" stroke-opacity="0.85"/><text x="757.8" y="42.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" fill="#1b1b1b" text-anchor="start" font-weight="bold" letter-spacing="0.8">STATE AGENCY</text><text x="757.8" y="93.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="23" fill="#6f6a64" text-anchor="start" font-weight="normal">was $100.00 in FY2024</text><text x="757.8" y="168.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="45" fill="#17325c" text-anchor="start" font-weight="bold">$98.75</text><line x1="1462.5" y1="187.0" x2="1462.5" y2="425.3" stroke="#ffffff" stroke-width="5.0" stroke-opacity="0.85"/><text x="1462.5" y="42.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" fill="#1b1b1b" text-anchor="start" font-weight="bold" letter-spacing="0.8">DISBURSEMENTS</text><text x="1462.5" y="93.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="23" fill="#6f6a64" text-anchor="start" font-weight="normal">was $92.73 in FY2024</text><text x="1462.5" y="168.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="45" fill="#17325c" text-anchor="start" font-weight="bold">$84.47</text><line x1="2167.2" y1="187.0" x2="2167.2" y2="410.8" stroke="#ffffff" stroke-width="5.0" stroke-opacity="0.85"/><text x="2167.2" y="42.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" fill="#1b1b1b" text-anchor="start" font-weight="bold" letter-spacing="0.8">CLAIMS TO PROVIDERS</text><text x="2167.2" y="93.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="23" fill="#6f6a64" text-anchor="start" font-weight="normal">was $87.07 in FY2024</text><text x="2167.2" y="168.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="45" fill="#17325c" text-anchor="start" font-weight="bold">$79.32</text><line x1="2872.0" y1="187.0" x2="2872.0" y2="410.4" stroke="#ffffff" stroke-width="5.0" stroke-opacity="0.85"/><text x="2872.0" y="42.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" fill="#1b1b1b" text-anchor="end" font-weight="bold" letter-spacing="0.8">BENEFICIARIES</text><text x="2872.0" y="93.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="23" fill="#6f6a64" text-anchor="end" font-weight="normal">was $86.92 in FY2024</text><text x="2872.0" y="168.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="45" fill="#17325c" text-anchor="end" font-weight="bold">$78.33</text><path d="M53.0,463.0 L76.0,486.0 L53.0,509.0 L30.0,486.0 Z" fill="#8B5A5A" stroke="#5c3a3a" stroke-width="5.0"/><path d="M757.8,457.8 L780.8,480.8 L757.8,503.8 L734.8,480.8 Z" fill="#8B5A5A" stroke="#5c3a3a" stroke-width="5.0"/><path d="M1462.5,421.1 L1485.5,444.1 L1462.5,467.1 L1439.5,444.1 Z" fill="#8B5A5A" stroke="#5c3a3a" stroke-width="5.0"/><path d="M1462.5,421.1 L1485.5,444.1 L1462.5,467.1 L1439.5,444.1 Z