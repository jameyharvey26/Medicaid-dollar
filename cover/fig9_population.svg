<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2925 1216" role="img" aria-labelledby="pt pd"><title id="pt">Who the law impacts</title><desc id="pd">Who the law impacts. Five eligibility categories. The left panel shows what impacted each one per $100 of Medicaid spending, with the FY2030 remainder solid inside the FY2024 outline. The right panel shows the fall for each, at 5 times the scale, split into coverage and rate. New adult group: $19.59 in FY2024 and $14.16 in FY2030, of which $4.79 of the fall is coverage and $0.64 is rate. Disabled: $25.17 in FY2024 and $23.97 in FY2030, of which $0.29 of the fall is coverage and $0.90 is rate. Aged: $18.55 in FY2024 and $17.64 in FY2030, of which $0.21 of the fall is coverage and $0.69 is rate. Children: $13.58 in FY2024 and $12.97 in FY2030, of which $0.16 of the fall is coverage and $0.46 is rate. Other adult: $10.19 in FY2024 and $9.73 in FY2030, of which $0.12 of the fall is coverage and $0.34 is rate. Composition by service is in Figure 4; the loss is not divided by service anywhere in this paper.</desc><rect width="2925" height="1216" fill="#ffffff"/><text x="585.0" y="65.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" fill="#1b1b1b" text-anchor="start" font-weight="bold" letter-spacing="1.1">WHAT IMPACTED THEM, PER $100</text><text x="1802.0" y="65.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" fill="#6f4747" text-anchor="start" font-weight="bold" letter-spacing="1.1">THE FALL, AT 5× THE SCALE</text><rect x="2340.0" y="30.0" width="47" height="40" fill="#8B5A5A" stroke="#5c3a3a" stroke-width="4.0"/><text x="2403.0" y="63.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="31" fill="#1b1b1b" text-anchor="start" font-weight="normal">coverage</text><rect x="2621.0" y="30.0" width="47" height="40" fill="#c4a0a0" stroke="#6f4747" stroke-width="4.0"/><text x="2684.0" y="63.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="31" fill="#1b1b1b" text-anchor="start" font-weight="normal">rate</text><line x1="1744" y1="23" x2="1744" y2="970" stroke="#ded7c8" stroke-width="5.0"/><text x="550.0" y="180.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="45" fill="#1b1b1b" text-anchor="end" font-weight="bold">New adult group</text><text x="550.0" y="224.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" fill="#6f6a64" text-anchor="end" font-weight="normal" font-style="italic">§71119 and §71107 impact this</text><text x="550.0" y="259.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" fill="#6f6a64" text-anchor="end" font-weight="normal" font-style="italic">group and no other</text><rect x="585.0" y="136.0" width="710.8" height="70" fill="none" stroke="#7d8fa3" stroke-width="5.0"/><rect x="585.0" y="136.0" width="513.8" height="70" fill="#17325c"/><text x="608.0" y="185.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="43" fill="#ffffff" text-anchor="start" font-weight="bold">$14.16</text><text x="1744.0" y="185.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="33" fill="#6f6a64" text-anchor="end" font-weight="normal">of $19.59</text><path d="M1098.8,218.0 L1767.0,218.0 L1802.0,136.0" fill="none" stroke="#7d8fa3" stroke-width="4.0" stroke-dasharray="12,12"/><rect x="1802.0" y="136.0" width="869.0" height="70" fill="#8B5A5A" stroke="#5c3a3a" stroke-width="5.0"/><rect x="2671.0" y="136.0" width="115.9" height="70" fill="#c4a0a0" stroke="#6f4747" stroke-width="5.0"/><path d="M2236.5,136.0 L2236.5,122.0 L2250.5,122.0" fill="none" stroke="#6f4747" stroke-width="4.0"/><text x="2259.5" y="110.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="33" fill="#6f4747" text-anchor="start" font-weight="bold">−$4.79  coverage</text><path d="M2729.0,206.0 L2729.0,225.0 L2663.1,225.0" fill="none" stroke="#6f4747" stroke-width="4.0"/><text x="2672.1" y="255.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="33" fill="#6f4747" text-anchor="start" font-weight="normal">−$0.64  rate</text><text x="550.0" y="360.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="45" fill="#1b1b1b" text-anchor="end" font-weight="bold">Disabled</text><text x="550.0" y="404.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" fill="#6f6a64" text-anchor="end" font-weight="normal" font-style="italic">rates, not enrolment: the directed</text><text x="550.0" y="439.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" fill="#6f6a64" text-anchor="end" font-weight="normal" font-style="italic">payment cap and the contraction</text><rect x="585.0" y="316.0" width="913.0" height="70" fill="none" stroke="#7d8fa3" stroke-width="5.0"/><rect x="585.0" y="316.0" width="869.8" height="70" fill="#17325c"/><text x="608.0" y="365.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="43" fill="#ffffff" text-anchor="start" font-weight="bold">$23.97</text><text x="1744.0" y="365.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="33" fill="#6f6a64" text-anchor="end" font-weight="normal">of $25.17</text><path d="M1454.8,398.0 L1767.0,398.0 L1802.0,316.0" fill="none" stroke="#7d8fa3" stroke-width="4.0" stroke-dasharray="12,12"/><rect x="1802.0" y="316.0" width="52.6" height="70" fill="#8B5A5A" stroke="#5c3a3a" stroke-width="5.0"/><rect x="1854.6" y="316.0" width="163.7" height="70" fill="#c4a0a0" stroke="#6f4747" stroke-width="5.0"/><path d="M1828.3,316.0 L1828.3,302.0 L1842.3,302.0" fill="none" stroke="#6f4747" stroke-width="4.0"/><text x="1851.3" y="290.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="33" fill="#6f4747" text-anchor="start" font-weight="bold">−$0.29  coverage</text><path d="M1936.4,386.0 L1936.4,405.0 L1950.4,405.0" fill="none" stroke="#6f4747" stroke-width="4.0"/><text x="1959.4" y="435.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="33" fill="#6f4747" text-anchor="start" font-weight="normal">−$0.90  rate</text><text x="550.0" y="540.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="45" fill="#1b1b1b" text-anchor="end" font-weight="bold">Aged</text><text x="550.0" y="584.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" fill="#6f6a64" text-anchor="end" font-weight="normal" font-style="italic">and a $1.27 bill: the Medicare</text><text x="550.0" y="619.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" fill="#6f6a64" text-anchor="end" font-weight="normal" font-style="italic">Savings rule suspended</text><rect x="585.0" y="496.0" width="672.9" height="70" fill="none" stroke="#7d8fa3" stroke-width="5.0"/><rect x="585.0" y="496.0" width="640.0" height="70" fill="#17325c"/><text x="608.0" y="545.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="43" fill="#ffffff" text-anchor="start" font-weight="bold">$17.64</text><text x="1744.0" y="545.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="33" fill="#6f6a64" text-anchor="end" font-weight="normal">of $18.55</text><path d="M1225.0,578.0 L1767.0,578.0 L1802.0,496.0" fill="none" stroke="#7d8fa3" stroke-width="4.0" stroke-dasharray="12,12"/><rect x="1802.0" y="496.0" width="38.7" height="70" fill="#8B5A5A" stroke="#5c3a3a" stroke-width="5.0"/><rect x="1840.7" y="496.0" width="125.6" height="70" fill="#c4a0a0" stroke="#6f4747" stroke-width="5.0"/><path d="M1821.4,496.0 L1821.4,482.0 L1835.4,482.0" fill="none" stroke="#6f4747" stroke-width="4.0"/><text x="1844.4" y="470.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="33" fill="#6f4747" text-anchor="start" font-weight="bold">−$0.21  coverage</text><path d="M1903.5,566.0 L1903.5,585.0 L1917.5,585.0" fill="none" stroke="#6f4747" stroke-width="4.0"/><text x="1926.5" y="615.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="33" fill="#6f4747" text-anchor="start" font-weight="normal">−$0.69  rate</text><text x="550.0" y="720.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="45" fill="#1b1b1b" text-anchor="end" font-weight="bold">Children</text><text x="550.0" y="764.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" fill="#6f6a64" text-anchor="end" font-weight="normal" font-style="italic">nothing in the law names children</text><rect x="585.0" y="676.0" width="492.7" height="70" fill="none" stroke="#7d8fa3" stroke-width="5.0"/><rect x="585.0" y="676.0" width="470.4" height="70" fill="#17325c"/><text x="608.0" y="725.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="43" fill="#ffffff" text-anchor="start" font-weight="bold">$12.97</text><text x="1744.0" y="725.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="33" fill="#6f6a64" text-anchor="end" font-weight="normal">of $13.58</text><path d="M1055.4,758.0 L1767.0,758.0 L1802.0,676.0" fill="none" stroke="#7d8fa3" stroke-width="4.0" stroke-dasharray="12,12"/><rect x="1802.0" y="676.0" width="28.4" height="70" fill="#8B5A5A" stroke="#5c3a3a" stroke-width="5.0"/><rect x="1830.4" y="676.0" width="83.0" height="70" fill="#c4a0a0" stroke="#6f4747" stroke-width="5.0"/><path d="M1816.2,676.0 L1816.2,662.0 L1830.2,662.0" fill="none" stroke="#6f4747" stroke-width="4.0"/><text x="1839.2" y="650.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="33" fill="#6f4747" text-anchor="start" font-weight="bold">−$0.16  coverage</text><path d="M1871.9,746.0 L1871.9,765.0 L1885.9,765.0" fill="none" stroke="#6f4747" stroke-width="4.0"/><text x="1894.9" y="795.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="33" fill="#6f4747" text-anchor="start" font-weight="normal">−$0.46  rate</text><text x="550.0" y="900.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="45" fill="#1b1b1b" text-anchor="end" font-weight="bold">Other adult</text><text x="550.0" y="944.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" fill="#6f6a64" text-anchor="end" font-weight="normal" font-style="italic">parents, caretakers, pregnancy —</text><text x="550.0" y="979.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" fill="#6f6a64" text-anchor="end" font-weight="normal" font-style="italic">the work rule passes over them</text><rect x="585.0" y="856.0" width="369.6" height="70" fill="none" stroke="#7d8fa3" stroke-width="5.0"/><rect x="585.0" y="856.0" width="353.0" height="70" fill="#17325c"/><text x="608.0" y="905.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="43" fill="#ffffff" text-anchor="start" font-weight="bold">$9.73</text><text x="1744.0" y="905.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="33" fill="#6f6a64" text-anchor="end" font-weight="normal">of $10.19</text><path d="M938.0,938.0 L1767.0,938.0 L1802.0,856.0" fill="none" stroke="#7d8fa3" stroke-width="4.0" stroke-dasharray="12,12"/><rect x="1802.0" y="856.0" width="21.3" height="70" fill="#8B5A5A" stroke="#5c3a3a" stroke-width="5.0"/><rect x="1823.3" y="856.0" width="61.9" height="70" fill="#c4a0a0" stroke="#6f4747" stroke-width="5.0"/><path d="M1812.7,856.0 L1812.7,842.0 L1826.7,842.0" fill="none" stroke="#6f4747" stroke-width="4.0"/><text x="1835.7" y="830.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="33" fill="#6f4747" text-anchor="start" font-weight="bold">−$0.12  coverage</text><path d="M1854.3,926.0 L1854.3,945.0 L1868.3,945.0" fill="none" stroke="#6f4747" stroke-width="4.0"/><text x="1877.3" y="975.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="33" fill="#6f4747" text-anchor="start" font-weight="normal">−$0.34  rate</text><text x="47.0" y="1099.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="31" fill="#1b1b1b" text-anchor="start" font-weight="normal">Coverage is somebody dropped: they are no longer enrolled and the whole of their care goes to zero.</text><text x="47.0" y="1148.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="31" fill="#1b1b1b" text-anchor="start" font-weight="normal">Rate is the same person, still enrolled, with their provider paid less. No individual loses a share of their own care.</text><text x="1802.0" y="1099.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="31" fill="#6f4747" text-anchor="start" font-weight="bold">The right-hand panel is drawn at 5 times the scale of the left.</text></svg>