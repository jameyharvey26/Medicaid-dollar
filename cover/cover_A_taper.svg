idth="1.6" stroke-opacity="0.7"/><text x="212.0" y="934.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="end" font-weight="bold" letter-spacing="1.1">CLAIMS TO PROVIDERS</text><text x="212.0" y="962.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" fill="#17325c" text-anchor="end" font-weight="bold">$79.32</text><text x="212.0" y="982.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#7a7570" text-anchor="end" font-weight="normal">was $87.07</text><rect x="495.2" y="954" width="3.4" height="12" fill="#8B5A5A" fill-opacity="0.9"/><line x1="503.6" y1="960.0" x2="608" y2="960.0" stroke="#e2dccf" stroke-width="1"/><text x="620.0" y="964.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#6f4747" text-anchor="start" font-weight="bold">−$1.04</text><text x="682.0" y="964.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="start" font-weight="normal">Medicaid enrollment rule suspended</text><text x="682.0" y="981.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#7a7570" text-anchor="start" font-weight="normal" font-style="italic">People who would have had a paid claim</text><rect x="495.2" y="1002" width="3.0" height="12" fill="#8B5A5A" fill-opacity="0.9"/><line x1="503.0" y1="1008.0" x2="608" y2="1008.0" stroke="#e2dccf" stroke-width="1"/><text x="620.0" y="1012.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#6f4747" text-anchor="start" font-weight="bold">−$0.85</text><text x="682.0" y="1012.0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="start" font-weight="normal">Directed payment caps</text><text x="682.0" y="1029.0" font-family="Segoe UI, Helvetica Neue, Helvetica, 